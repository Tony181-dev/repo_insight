<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>repomap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div class="logo"><i>&#9670;</i> repomap</div>
    <div id="rootp"></div>
    <div id="stat"></div>
    <div id="views" class="seg" role="group" data-i18n-title="viewTitle">
      <button type="button" data-view="tree" data-i18n="viewTree"></button><button type="button" data-view="arch" data-i18n="viewBlocks"></button>
    </div>
    <div id="sbox">
      <input id="q" data-i18n-ph="searchPh" autocomplete="off">
      <div id="res"></div>
    </div>
    <div id="lang" class="seg" role="group" data-i18n-title="langTitle">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="vi">VI</button>
    </div>
    <button id="b-panel" data-i18n-title="panelToggle">&#9776;</button>
  </header>

  <main id="main">
    <section id="stage">
      <div id="tools">
        <button id="b-fit" data-i18n="fit"></button>
        <button id="b-more" data-i18n="expand"></button>
        <button id="b-collapse" data-i18n="collapse"></button>
      </div>
      <svg id="svg"><g id="vp"><g id="gl"></g><g id="gn"></g></g></svg>
      <div id="legend"></div>
      <div class="empty" id="empty" data-i18n="loading"></div>
      <div id="arch" hidden>
        <div class="arch-bar">
          <input id="arch-q" data-i18n-ph="archFilter" autocomplete="off">
          <div id="arch-layers"></div>
          <button id="arch-open" data-i18n="expandAll"></button>
          <button id="arch-close" data-i18n="collapseAll"></button>
          <button id="arch-follow" aria-pressed="true" data-i18n="follow" data-i18n-title="followTitle"></button>
          <button id="arch-fit" data-i18n="fit"></button>
          <button id="arch-zoom" data-i18n-title="zoomReset">100%</button>
          <span id="arch-stat" class="muted"></span>
          <button id="arch-rescan" data-i18n="rescan"></button>
        </div>
        <div id="arch-scroll"><div id="arch-canvas"></div></div>
      </div>
    </section>

    <div id="panel-resizer" role="separator" aria-orientation="vertical" data-i18n-title="panelResize"
      aria-label="Resize details panel"
      aria-valuemin="280" aria-valuenow="480" tabindex="0"></div>
    <aside id="panel">
      <div class="muted" data-i18n-html="help"></div>
    </aside>

    <section id="source" hidden>
      <div class="src-bar">
        <button id="src-back" data-i18n="back"></button>
        <div id="src-title"></div>
        <input id="src-find" data-i18n-ph="findFile" autocomplete="off">
        <input id="src-grep" data-i18n-ph="searchText" autocomplete="off">
      </div>
      <div class="src-body">
        <nav id="src-tree"></nav>
        <div id="src-view"></div>
      </div>
    </section>
  </main>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button value="no" data-i18n="no"></button>
        <button class="confirm-yes" value="yes" data-i18n="yes"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
